name: SV evidence regression
# Optional development checks; patient analysis does not run this workflow.
on:
  pull_request:
  workflow_dispatch:
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy matplotlib pillow pyyaml pysam snakemake==8.30.0
      - run: python -m unittest discover -s tests -v
      - uses: r-lib/actions/setup-r@v2
      - name: Parse R plotting scripts
        run: |
          Rscript -e 'files <- c(list.files("r_plots", pattern="\\.R$", full.names=TRUE), "scripts/xci_cluster_methylation.R"); for (f in files) { cat("Parsing", f, "\\n"); parse(file=f) }'
      - run: snakemake -s Snakefile_LRS_update --list-rules
        if: always()
        working-directory: snakemake_pipelines/lrs
      - run: snakemake -s Snakefile_LRS_postprocess --list-rules
        if: always()
        working-directory: snakemake_pipelines/lrs
      - run: snakemake -s Snakefile_SRS_WGS --list-rules
        if: always()
        working-directory: snakemake_pipelines/srs_wgs_pipeline

      - name: Parse BAM-free VCF-only Genomiser entry point
        if: always()
        working-directory: snakemake_pipelines/genomiser_vcf_only
        run: |
          snakemake -s Snakefile --list-rules
          python - <<'PY'
          import subprocess
          result = subprocess.run(
              ["snakemake", "-s", "Snakefile", "--list-rules"],
              check=True, capture_output=True, text=True
          )
          expected = {"all", "prepare_patient_profile", "genomiser_genome"}
          found = set(result.stdout.splitlines())
          if found != expected:
              raise SystemExit(f"Unexpected VCF-only jobs: {found}; expected: {expected}")
          PY

      - name: Enable Genomiser rules for parser validation (LRS)
        if: always()
        working-directory: snakemake_pipelines/lrs
        run: |
          snakemake -s Snakefile_LRS_update --list-rules --config genomiser_enabled=true patient_profiles_tsv=/tmp/clinical.tsv genomiser_remm_hg38=/tmp/ReMM.v0.4.hg38.tsv.gz
          snakemake -s Snakefile_LRS_postprocess --list-rules --config genomiser_enabled=true patient_profiles_tsv=/tmp/clinical.tsv genomiser_remm_hg38=/tmp/ReMM.v0.4.hg38.tsv.gz
      - name: Enable Genomiser rules for parser validation (SRS)
        if: always()
        working-directory: snakemake_pipelines/srs_wgs_pipeline
        run: |
          snakemake -s Snakefile_SRS_WGS --list-rules --config genomiser_enabled=true patient_profiles_tsv=/tmp/clinical.tsv genomiser_remm_hg38=/tmp/ReMM.v0.4.hg38.tsv.gz
