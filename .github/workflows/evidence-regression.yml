name: SV evidence regression
on: [push, pull_request]
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy matplotlib pillow pyyaml pysam snakemake==8.30.0
      - run: python -m unittest discover -s tests -v
      - uses: r-lib/actions/setup-r@v2
      - name: Parse R plotting scripts
        run: |
          Rscript -e 'files <- c(list.files("r_plots", pattern="\\.R$", full.names=TRUE), "scripts/xci_cluster_methylation.R"); for (f in files) { cat("Parsing", f, "\\n"); parse(file=f) }'
      - run: snakemake -s Snakefile_LRS_update --list-rules
        working-directory: snakemake_pipelines/lrs
      - run: snakemake -s Snakefile_LRS_postprocess --list-rules
        working-directory: snakemake_pipelines/lrs
      - run: snakemake -s Snakefile_SRS_WGS --list-rules
        working-directory: snakemake_pipelines/srs_wgs_pipeline
