# CAUTION: a bioconda deepvariant recipe exists, but Google only tests
# and supports DeepVariant via the official Docker/Singularity images
# (see google/deepvariant docs). Users routinely report the conda build
# hanging on environment solve or missing the run_deepvariant entrypoint
# (google/deepvariant issues #806, #865). This env is provided as an
# opt-in fallback only - the Snakefile's default deepvariant_snp rule
# uses Snakemake's `container:` directive against the official image
# instead. Switch the rule to `conda: CONDAENV + "deepvariant.yaml"` only
# if you've verified this env works on your system.
name: deepvariant
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::deepvariant=1.6.1
