# VCF-only Genomiser: no BAMs, variant calling or read-level analysis.
# Copy existing genome-wide SNV/indel and merged SV VCFs into the paths below,
# or replace these paths with their actual locations.
#
# Only clinical HON cases with existing VCFs are listed below.
# Technical validation controls 21930 and 25428 are deliberately excluded.
# Add other clinically characterized patients once both VCF inputs exist.
# Existing VCF locations are unchanged; no BAMs or callers are rerun.
vcf_samples:
  "14996":
    small_vcf: "/DATA/casadei7/nanopore/WGS/RESULTS/14996/snp_clair3/14996.vcf.gz"
    sv_vcf: "/DATA/casadei7/nanopore/WGS/RESULTS/14996/sv/merged/14996_merged_SV.vcf.gz"
  "13048":
    small_vcf: "/DATA/casadei7/nanopore/WGS/RESULTS/13048/snp_clair3/13048.vcf.gz"
    sv_vcf: "/DATA/casadei7/nanopore/WGS/RESULTS/13048/sv/merged/13048_merged_SV.vcf.gz"

# Isolated Genomiser results: never overwrite the original LRS/SRS results.
path: "/DATA/casadei7/nanopore/WGS/GENOMISER_VCF_ONLY_RESULTS"

# Clinical data stay PRIVATE on the server: one row per patient.
patient_profiles_tsv: "/DATA/casadei7/private_clinical/patient_profiles.tsv"
# Requested HON computational profile: confirmed patient HPO findings PLUS
# shared HON reference terms; these are NOT additional confirmed clinical findings.
# Blank patient findings remain unknown, never presumed absent.
hpo_include_shared_hon_seeds: true
hon_hpo_seed_terms: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/hon_hpo_seed_terms.tsv"

# Required Genomiser analysis and resources.
genomiser_enabled: true
genomiser_analysis_yaml: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/config/genomiser/genome_analysis.yml"
genomiser_cli_jar: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/AnnotSV_annotations/jar/exomiser-cli-15.1.0/exomiser-cli-15.1.0.jar"
genomiser_data_dir: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/AnnotSV_annotations/jar/exomiser-cli-15.1.0/data"
genomiser_remm_hg38: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/remm/ReMM.v0.4.hg38.tsv.gz"
genomiser_genome_data_version: "2512"
genomiser_phenotype_data_version: "2512"
genomiser_java: "java"
genomiser_memory_gb: 32
genomiser_benchmark_truth_tsv: null
