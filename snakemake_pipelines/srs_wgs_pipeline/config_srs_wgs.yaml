# SRS PIPELINE CONFIGURATION — Illumina whole-genome sequencing
# Start with sections 1–3. Sections 4–10 contain the analysis defaults.
# Use spaces, not tabs. Quote numeric sample IDs, as in the LRS config.
# Run from snakemake_pipelines/srs_wgs_pipeline/ so relative paths work.

# ============================================================
# 1. SAMPLES, RESULTS AND REFERENCE — edit these first
# ============================================================
samples:
  patient01: "/data/srs_bams/patient01.sorted.bam"
  patient02: "/data/srs_bams/patient02.sorted.bam"

path: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/snakemake_pipelines/srs_wgs_pipeline/srs_CNTRL_results"          # Folder where results will be written.
ref: "/DATA/Reference/hg38.fa"      # Same GRCh38 FASTA used for alignment.
threads: 32                        # Maximum threads for one analysis step.



# Existing environment definitions, shared with LRS. Installation is in README.
condaenv: "../../envs/"

# ============================================================
# 2. PANEL, GENES AND ANNOTATION FILES — check these paths
# ============================================================
# SV and DeepVariant discovery are genome-wide. The panel labels known genes;
# it does not restrict variant calling.
bed: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/PANEL_OA/optic_neuropathy_panel.bed"
candidate_genes_list: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/PANEL_OA/optic_neuropathy_genes.txt"
gene_bed: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/gencode.genes.hg38.sorted.bed"
exclude_bed: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/delly_hg38_exclude.bed"

# This BED selects a focused review VCF only. Calling and VEP annotation
# retain the full genome-wide small-variant set, including noncoding variants.
# The supplied .tsv also uses BED coordinates: start = 0-based, end = excluded.
nuclear_mito_candidate_bed: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/PANEL_OA/optic_neuropathy_mito_panel_annotated.tsv"
expansionhunter_catalog: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/variant_catalog_hg38_repeats.json"

vep_cache_dir: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/vep"
vep_assembly: "GRCh38"
vep_cache_version: 116             # Must match envs/srs_vep.yaml and cache.
# Official runner/model distribution; Apptainer runtime is in deepvariant.yaml.
# On the server, verify Apptainer can execute this image (README setup steps).
deepvariant_image: "docker://google/deepvariant:1.10.0"
# The human GRCh38 cache must include regulatory annotations (--regulatory).
# No coding-only, gene-panel or VEP-impact filter is used on the master table.

annotsv_annotations_dir: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/AnnotSV_annotations"
annotsv_benign_af: 0.01            # AnnotSV setting; not the final AF filter.

# One seed file for custom ranking and Exomiser. This is a FILE PATH.
hon_hpo_seed_terms: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/hon_hpo_seed_terms.tsv"

# Keep the custom ranking and compare with OFFLINE CLI phenotype matching.
exomiser_enabled: true
exomiser_cli_jar: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/AnnotSV_annotations/jar/exomiser-cli-15.1.0/exomiser-cli-15.1.0.jar"
# Root containing the EXTRACTED data folders; edit if downloaded elsewhere.
exomiser_data_dir: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/AnnotSV_annotations/jar/exomiser-cli-15.1.0/data"
exomiser_genome_data_version: "2512"
exomiser_phenotype_data_version: "2512"
exomiser_java: "java"            # Java 21 in envs/exomiser.yaml (--use-conda).
exomiser_memory_gb: 8             # Heap per distinct HPO query.
# PHENOTYPE_ONLY preset; no patient variants are analysed by this comparison.
# null uses only CORE_OCULAR_HON rows in hon_hpo_seed_terms above.
# hpo_terms accepts HPO IDs, not a file path.
# A string/list here replaces that shared profile for all samples.
hpo_terms: null
# Optional complete patient HPO files; each overrides the shared profile.
# Example: {"21930": "/path/to/21930.hpo.tsv"}
patient_hpo_files: {}

monarch_nodes: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/monarch/monarch-kg_nodes.tsv"
monarch_edges: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/monarch/monarch-kg_edges.tsv"

# ============================================================
# 3. BIOLOGICAL FOCUS AND OPTIONAL ANALYSES
# ============================================================
# Main focus: nuclear genes related to mitochondrial function, including
# non-panel genes. MitoCarta membership is context, not proof of causality.
mitocarta_enabled: true
mitocarta_file: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/mitocarta/Human.MitoCarta3.0.xls"
mitocarta_pathways_gmx: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/mitocarta/Human.MitoPathways3.0.gmx"

# Extra algorithmic breakpoint support from the same short-read BAM.
gridss_enabled: true
# Secondary mtDNA SNV/heteroplasmy analysis.
mtdna_enabled: true
mt_contig: "chrM"
mutserve_level: 0.01               # Minimum heteroplasmy fraction = 1%.
# Leave MELT off until its local files in section 7 are installed.
melt_enabled: false

# Population database: optional, local GRCh38 VCF and its index.
# null means frequency is unavailable; it does not prove a novel variant.
gnomad_sv_vcf: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/gnomad/gnomad.v4.1.sv.sites.vcf.gz"
gnomad_sv_index: null             # null uses <VCF path>.tbi when a VCF is set.

# ============================================================
# 4. ALIGNMENT QC
# ============================================================
# Below these thresholds, mark the sample REVIEW; do not delete its results.
qc_min_mean_coverage: 15
qc_min_mapped_percent: 95
canonical_chromosomes_only: true   # chr1–22, chrX, chrY and chrM.

# ============================================================
# 5. MANTA + DELLY AND GRIDSS SUPPORT
# ============================================================
# Evidence filters before Manta/DELLY merging (SV length is in base pairs).
evidence_min_support: 2
evidence_min_svlen: 50
evidence_max_svlen: 250000000
# evidence_min_gq: 10
# evidence_blacklist_bed: "/DATA/Reference/low_mappability_segdup.bed"

# Merge nearby events of matching type/orientation, keeping single-caller SVs.
# Agreement between two callers is support, not validation.
survivor_max_distance: 1000
survivor_min_support: 1       # Keep single-caller events in the discovery VCF.
survivor_require_same_type: 1
survivor_require_same_strand: 1
survivor_use_size_ratio: 0
survivor_min_size: 50
survivor_caller_order: "Manta,Delly"  # Must stay in the actual input order.
multi_caller_min_support: 2

gridss_threads: 32
gridss_min_qual: null
# Optional installed exclusion BED. See README for reference preparation.
gridss_exclude_bed: null
# Set true only if the aligner already wrote correct SA split-read tags.
gridss_skip_softclip_realignment: false
supporting_evidence_breakpoint_tolerance: 500

# ============================================================
# 6. CNVPYTOR — COPY-NUMBER EVIDENCE FROM READ DEPTH
# ============================================================
# 10 kb = main bins; 100 kb = large-event context. Small SVs depend mainly
# on breakpoint evidence. B-allele frequency (BAF) adds context separately.
cnvpytor_main_bin_size: 10000
cnvpytor_large_cnv_bin_size: 100000
cnvpytor_chroms: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22, chrX, chrY]
# Quality requirements for adding a CNVpytor-only deletion/duplication.
cnvpytor_max_q0: 0.5               # Maximum fraction of mapping-quality-0 reads.
cnvpytor_max_pn: 0.5               # Maximum fraction of unknown reference bases.
cnvpytor_max_eval1: 0.0001
cnvpytor_min_reciprocal_overlap: 0.5

# ============================================================
# 7. MELT FILES — used only when melt_enabled is true
# ============================================================
melt_jar: "/DATA/casadei7/tools/MELT/MELTv2.2.2/MELT.jar"
melt_genes_bed: "/DATA/casadei7/tools/MELT/MELTv2.2.2/add_bed_files/Hg38/Hg38.genes.bed"
melt_java_memory_gb: 32
melt_transposons:
  ALU: "/DATA/casadei7/tools/MELT/MELTv2.2.2/me_refs/Hg38/ALU_MELT.zip"
  LINE1: "/DATA/casadei7/tools/MELT/MELTv2.2.2/me_refs/Hg38/LINE1_MELT.zip"
  SVA: "/DATA/casadei7/tools/MELT/MELTv2.2.2/me_refs/Hg38/SVA_MELT.zip"
  HERVK: "/DATA/casadei7/tools/MELT/MELTv2.2.2/me_refs/Hg38/HERVK_MELT.zip"

# ============================================================
# 8. CANDIDATE REVIEW AND PLOTS — same plotting controls as LRS
# ============================================================
diagnostic_candidate_top_n: 0      # 0 = keep every ranked SV–gene row.
samplot_enabled: true
samplot_top_n: 50                  # Maximum read-evidence images per sample.
samplot_min_mapq: 20

# Run the separate all_thesis_plots target after the analysis.
plot_top_genes: 50
candidate_review_top_n: 10          # Initial review rows per panel group.
candidate_locus_top_n: 30          # Maximum diagrams of selected loci.
candidate_plot_gene_gtf: null      # Matching GRCh38 GTF for real exon tracks.

# Position map: reuse reference index, panel and DELLY exclusion BED automatically.
# Add optional matching GRCh38 tracks using the README; null = unavailable.
genome_plot_centromere_bed: null
genome_plot_gap_bed: null
genome_plot_depth_bin_bp: 10000    # Measured depth bins from the existing QC step.
# Map each repeat class to a BED path; e.g. Tandem_repeats: /path/to/trf.bed.
genome_plot_repeat_beds: {}
genome_plot_random_draws: 200
candidate_assembly_manifest: null # Optional TSV with SV_ID and PAF_PATH.

# Separate review views; the complete candidate table is preserved.
# One combined group retains measured AF <=1% OR missing AF. The plots use
# different colours within that group to show which frequency is known.
downstream_size_cutoff: 1000        # Main view >1 kb; <1 kb and =1 kb separate.
downstream_max_af: 0.01
downstream_inv_min_reads: 3
downstream_inv_strong_reads: 5       # Higher support tier, not validation.

# SRS-specific downstream interpretation (independent of SV calling).
# The same clinical/biological questions as LRS, with short-read evidence.
srs_event_breakpoint_gene_tolerance: 10000
srs_large_sv_depth_min_size: 100000   # Evaluate DEL/DUP >=100 kb.
# With conventional short reads, SNV-SV cis/trans phase is unresolved unless
# independently established; WhatsHap small-variant phasing is not SV phasing.

# ============================================================
# 9. ALLELE RESEARCH ASSESSMENT — optional patient/family evidence
# ============================================================
# Keep null when unavailable. The pipeline does not infer missing family data
# or establish an SV + SNV in trans from small-variant WhatsHap phasing alone.
allele_patient_context: null
allele_disease_models: null
allele_evidence: null
allele_family_genotypes: null
allele_rare_af: 0.01
allele_min_support: 5
allele_min_gq: 20
allele_min_dp: 5

# ============================================================
# 10. OPTIONAL POSITIVE-CONTROL CHECKS
# ============================================================
candidate_truth_tsv: null          # Columns: GENE; optional SV_ID.
sv_truth_vcfs: {}                  # Sample ID: indexed truth SV VCF.
sv_truth_beds: {}                  # Same sample ID: confident-region BED.

# ============================================================
# 11. ALPHAGENOME ATLAS — optional RESEARCH context, same as LRS
# ============================================================
# Enable after downloading official GRCh38 AVI and its .tbi index. A splicing
# score file is a different resource; file size does not identify its contents.
alphagenome_atlas_enabled: false
alphagenome_avi_file: null          # Absolute path to official AVI .tsv.gz.
alphagenome_avi_release: null       # Exact download filename/release, for provenance.
alphagenome_review_phred: 20        # Top 1% of genome-wide substitutions, not probability.
dna_sample_tissue: "blood"          # DNA collection context, not a prediction tissue.
dna_sample_tissues: {}              # For future muscle DNA: "sample": "muscle".
# Selected native RNA/splicing plots require an API key exported on the server.
# Never write the key in YAML. Choose model tissues for the biological question.
alphagenome_native_plots_enabled: false
alphagenome_plot_selection_files: {} # Sample ID: reviewed allele-selection TSV (README).
alphagenome_prediction_ontology_terms: [] # Actual available tissue IDs; inspect metadata.
alphagenome_native_max_variants: 10
alphagenome_sequence_length: 1048576 # 1 Mb context, not validated SV-size support.
alphagenome_min_flank: 10000
alphagenome_model_version: "ALL_FOLDS"
alphagenome_prediction_min_gq: 20
alphagenome_prediction_min_dp: 10
alphagenome_native_cache_only: false
