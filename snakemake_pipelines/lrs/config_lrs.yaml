# ============================================================
# LRS PIPELINE CONFIGURATION
# ============================================================

samples:
  # Always quote sample IDs that are numeric.
  "21930": "/DATA/casadei7/nanopore/WGS/CONTROL/21930/21930.merged.sort.bam"
  "25428": "/DATA/casadei7/nanopore/WGS/CONTROL/25428/25428.merged.sort.bam"

path: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/outs_test_CNTRL"
ref: "/DATA/Reference/hg38.fa"
threads: 32

# ============================================================
# TARGET PANEL AND GENE REFERENCES
# ============================================================
# Structural-variant callers and Clair3 are genome-wide. The BED below is
# retained as the optic-neuropathy panel reference for panel annotation and
# compatibility with other workflows; the active LRS Clair3 rule does not use it.

bed: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/PANEL_OA/optic_neuropathy_panel.bed"

# Retained for backward compatibility/reference only; cuteSV is now called
# genome-wide and does not use this BED in Snakefile_LRS_update.
bedcutesv: "/DATA/casadei7/tools/SV-PIPELINE-main_v3__v3/PANEL_OA/optic_neuropathy_panel_cutesv.bed"

gene_bed: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/gencode.genes.hg38.sorted.bed"
candidate_genes_list: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/PANEL_OA/optic_neuropathy_genes.txt"

delly_genome: "ont"

# null = genome-wide tandem-repeat expansion discovery.
straglr_bed: null
straglr_script: "/home/casadei7/straglr/straglr.py"
straglr_annotation_min_overlap: 1

# null = extract modification calls genome-wide.
# Example targeted region: "chr3:193600000-193700000"
cpg_region: null

# ============================================================
# ENVIRONMENTS / EXECUTABLES
# ============================================================

# Conda YAML files are resolved from the active repository checkout.
# --conda-prefix still controls where Snakemake creates/reuses environments.

# modkit 0.6.4 executable installed on the analysis server.
# modkit itself is an external executable; envs/modkit.yaml supplies
# htslib/tabix for indexing the BGZF bedMethyl output.
#modkitenv: "/home/casadei7/dist_modkit_v0.6.4_cd85862/modkit"
modkitenv: "/home/casadei7/.cargo/bin/modkit"

# Main modkit processing uses the full Snakemake thread allocation (32).
# Main processing, I/O, sampling and BGZF compression are all set to 32 threads.
modkit_io_threads: 32
modkit_sampling_threads: 32
modkit_bgzf_threads: 32

# Clair3 ONT model directory.
clair3env: "/DATA/casadei7/BrainAging/Clair3_Models/r1041_e82_400bps_sup_v520/"

# ============================================================
# SNIFFLES2 / JASMINE
# ============================================================

vntr_bed: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/human_GRCh38_no_alt_analysis_set.trf.bed"

# false = standard germline calling.  Enable only when intentionally running
# Sniffles mosaic mode.
sniffles_mosaic: false
# Ignore alignments shorter than the standard Sniffles2 germline default.
sniffles_min_alignment_length: 1000

# Keep Sniffles' standard QC logic.  Leave this false in production.
sniffles_no_qc: false

# Keep Sniffles QC-failed candidates in the raw VCF/parsed evidence for audit.
# When rescue is enabled, any Sniffles FILTER=COV_VAR SV type may continue
# into Jasmine/AnnotSV, but it must still satisfy the normal evidence filters
# below (minimum support, >=50 bp when SV length is defined, canonical
# chromosomes, and any configured maximum size). The original COV_VAR status
# is retained as RESCUED_COV_VAR for manual review; rescue is not validation.
sniffles_keep_qc_failed_for_review: true
sniffles_rescue_cov_var: true

# This order MUST match the order written to Jasmine's file_list because
# SUPP_VEC is decoded using this order.
jasmine_caller_order: "Sniffles2,cuteSV,Delly"

# ============================================================
# VEP
# ============================================================

reference_dir: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference"
vep_cache_dir: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/vep"
vep_assembly: "GRCh38"

# ============================================================
# needLR POPULATION-AF BACKEND
# ============================================================
# needLR is a supplementary population-frequency branch.  It is NOT the
# source VCF for AnnotSV/VEP and therefore cannot remove BND or >=10 Mb calls
# from the master diagnostic/discovery callset.

needlr_backend_files: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/needlr/release/backend_files/"

# Optional exact-coordinate/type gnomAD-SV v4.1 annotation.
# Download the official GRCh38 gnomAD v4.1 genome-SV sites VCF and .tbi, then
# set this path. If null, the final tables explicitly report
# RESOURCE_NOT_CONFIGURED rather than borrowing AnnotSV's mixed benign AF.
gnomad_sv_vcf: null

# Research-prioritization population thresholds. The ranker uses the maximum
# explicit AF across exact gnomAD-SV and provisional needLR so one common
# population source cannot be hidden by a lower value in another source.
ranking_rare_af: 0.001
ranking_max_af: 0.01
# gnomad_sv_vcf: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/gnomad/gnomad.v4.1.sv.sites.vcf.gz"

# ============================================================
# TLDR
# ============================================================

tldr_elements: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/teref.ont.human.fa"

# Coordinate tolerances used only when attaching complementary evidence to the
# Jasmine-defined master SV table. They do not modify SV calling or merging.
complementary_straglr_breakpoint_tolerance: 500
complementary_tldr_breakpoint_tolerance: 500
complementary_longphase_breakpoint_tolerance: 500

# Optional region for the manual thesis methylation plot target.
# Keep null until a candidate locus is selected.
# Example: "chr3:193600000-193700000"
thesis_methylation_region: null

# ============================================================
# MITOCARTA / MITOCHONDRIAL CONTEXT
# ============================================================

# Main biological focus of the LRS interpretation:
#   PRIMARY   = nuclear genes encoding mitochondrial proteins/pathways
#   SECONDARY = variants physically located in the mitochondrial genome
#
# The secondary chrM output below is extracted from the existing Clair3 VCF.
# It is useful for candidate review, but Clair3 is not a dedicated heteroplasmy
# caller and this output must not be described as a complete mtDNA diagnosis.
analysis_primary_focus: "nuclear_mitochondrial_genes"
mtdna_analysis_role: "secondary"
lrs_mtdna_secondary_enabled: true
mt_contig: "chrM"

# Official Human MitoCarta3.0 workbook. Download from the Broad Institute
# MitoCarta3.0 resource into this local path before running the annotation.
mitocarta_file: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/mitocarta/Human.MitoCarta3.0.xls"
mitocarta_pathways_file: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/mitocarta/Human.MitoPathways3.0.gmx"

# ============================================================
# SAMPLOT READ-LEVEL BREAKPOINT EVIDENCE
# ============================================================

samplot_top_n: 20
samplot_min_mapq: 20
samplot_long_read_min_length: 1000
samplot_zoom_bp: 20000
samplot_window_bp: 5000
samplot_large_sv_threshold: 1000000

# Distance used by the mechanism-aware SV-gene event ranking to distinguish
# a breakpoint-proximal gene from a gene that is only inside a large
# inversion/BND interval.
sv_gene_breakpoint_tolerance: 10000

# ============================================================
# MONARCH / HPO DISCOVERY
# ============================================================

monarch_nodes: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/monarch/monarch-kg_nodes.tsv"
monarch_edges: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/monarch/monarch-kg_edges.tsv"
# Baseline HON anchors default to reference/hon_hpo_seed_terms.tsv in the active checkout.

# Core HON phenotypes are used only as ontology seeds. The semantic-similarity
# reference itself is generated from Monarch gene-disease-HPO associations.
# hon_hpo_seed_terms defaults to reference/hon_hpo_seed_terms.tsv in the active checkout.

# Optional patient-specific HPO files. Each file may be a one-HPO-ID-per-line
# file or TSV containing hpo_id/HPO_ID. If absent, the semantic stage reports
# PATIENT_HPO_NOT_AVAILABLE and does not invent a patient phenotype score.
patient_hpo_files: {}
# patient_hpo_files:
#   "21930": "/path/to/21930.hpo.tsv"

# Optional AnnotSV HPO argument.  Leave null unless you intentionally want to
# pass patient/analysis HPO terms directly to AnnotSV.
hpo_terms: null

# ============================================================
# ANNOTSV
# ============================================================

annotsv_benign_af: 0.01
annotsv_annotations_dir: "/DATA/casadei7/tools/SV-PIPELINE-main_v3/reference/AnnotSV_annotations"

# ============================================================
# PRE-JASMINE SV EVIDENCE FILTERING
# ============================================================
# Applied per caller after caller-specific evidence normalization.  Hard
# filters control which records enter Jasmine; soft flags remain visible in
# the TSV and final integrated table.

# filter_sv_evidence.py is resolved from the active repository checkout.

evidence_min_support: 2
evidence_min_svlen: 50

# Keep the LRS master SV callset on canonical GRCh38 chromosomes only.
# BND/TRA records are retained only when both breakends are canonical.
canonical_chromosomes_only: true

# No upper SV-length hard filter in the master callset. The active cuteSV
# command also uses --max_size -1 so >100 kb and >=10 Mb events are not
# silently lost at caller level. Large events remain available to
# Jasmine/AnnotSV/integrated analysis. needLR independently
# excludes BNDs and SVs >=10 Mb from population-frequency annotation.
evidence_max_svlen: null

# Optional soft flags:
# evidence_min_gq: 10
# evidence_blacklist_bed: "/path/to/low_mappability_segdup.bed"

# Companion evidence set only.  The complete Jasmine callset remains the
# source of truth even for single-caller calls.
high_confidence_min_supp: 2


# Allele-level research assessment. Does not filter the master SV universe.
# Optional TSV paths (or mappings from sample ID to path); see docs/ALLELE_ASSESSMENT.md.
allele_patient_context: null
allele_disease_models: null
allele_evidence: null
allele_family_genotypes: null
allele_rare_af: 0.01
allele_min_support: 5
allele_min_gq: 20
allele_min_dp: 5
# After the allele-level score has consumed caller/VEP audit payloads, keep a
# compact LRS table for downstream interpretation. AnnotSV gene-row JSON is
# retained until the inversion/breakpoint event-ranking step has used it.
allele_compact_output: true
methylation_units: "percent"  # modkit bedMethyl column 11


# ============================================================
# OPTIONAL X-CHROMOSOME INACTIVATION (XCI)
# ============================================================
# Run only on appropriate XX samples with native-DNA ONT MM/ML methylation
# tags. Do not add an XY sample simply because chrX reads are present.
#
# Example:
# xci_samples:
#   - "sample_A"
#   - "sample_B"
xci_samples: []

# GRCh38 CpG-island BED used for read-level methylation clustering.
# Required only when xci_samples is non-empty.
# Example: "/DATA/Reference/hg38.cpgIslandExt.chrX.bed"
xci_cpg_islands_bed: null

# Optional BED containing the XIST promoter CpG island. The XIST promoter has
# the opposite Xa/Xi methylation relationship from the standard rule and is
# therefore explicitly reversed when this BED is configured.
xci_xist_promoter_bed: null

xci_chrom: "chrX"
xci_min_cluster_reads: 5
xci_min_chrx_coverage: 15
xci_min_block_reads: 5

# Folded skew P: 0.50 = balanced; values closer to 0 = stronger skew.
# P < 0.40 corresponds to a major:minor ratio greater than 60:40. This is a
# descriptive flag, not a clinical pathogenicity threshold.
xci_neutral_threshold: 0.40

# Folded P <= 0.20 corresponds to a major:minor ratio >=80:20 and is reported
# as high skew for descriptive purposes, following the interpretation used in
# the SkewX study. This is not a clinical pathogenicity threshold.
xci_high_skew_threshold: 0.20

# Haplotype-specific modkit tracks are summarized in 5-Mb bins for the
# chromosome-wide methylation figure. Read-level CpG-island clustering remains
# the primary estimator of XCI skew.
xci_methylation_bin_bp: 5000000
xci_threads: 32


# ============================================================
# OPTIONAL FINAL THESIS ANALYSIS
# ============================================================
# These settings affect only the additive thesis_extensions.smk layer.
# They do not change SV calling, Jasmine merging, AnnotSV or needLR.

# Base coverage resolution used for large deletion/duplication depth support.
# Plotting combines these base bins into larger median bins for large events,
# which prevents individual depth spikes from dominating the figure.
depth_base_bin_bp: 10000
depth_min_mapq: 20
large_sv_depth_min_size: 100000

# Number of top genes/candidate gene-SV rows shown in the main thesis figures.
# Change this single value to 20 or 30 if you want a shorter/longer display.
thesis_top_genes: 25

# Publication-style R figures.
r_plot_top_candidates: 30
r_plot_top_hpo: 20

# ============================================================
# FOR QC PARAMETERS
# ============================================================
# Dorado sequencing summary and read-length QC are mandatory LRS QC outputs.
# Dorado officially defines `dorado summary <bam>` for BAMs produced from
# Dorado basecalling. These paths currently point to the WGS BAMs used by the
# pipeline; if a BAM no longer retains the required Dorado metadata, replace
# that sample path with its original Dorado basecalled BAM.
dorado_bin: "/home/casadei7/dorado-1.3.0/bin/dorado"
dorado_summary_bams:
  "21930": "/DATA/casadei7/nanopore/WGS/CONTROL/21930/21930.merged.sort.bam"
  "25428": "/DATA/casadei7/nanopore/WGS/CONTROL/25428/25428.merged.sort.bam"

# Read-length threshold used to report the long-read subset separately from
# all reads. N50 itself is a QC metric; this threshold is what separates the
# short-read tail from the long-read QC subset.
n50_min_length: 1000
