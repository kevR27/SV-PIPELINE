# ============================================================
# LRS PIPELINE CONFIGURATION
# ============================================================

samples:
  # Always quote sample IDs that are numeric.
  "14996": "/DATA/casadei7/nanopore/WGS/14996_HMW_bam/14996_HMW_merged.bam"
  "21930": "/DATA/casadei7/nanopore/WGS/CONTROL/21930/21930.merged.sort.bam"
  "12066": "/DATA/casadei7/nanopore/WGS/CONTROL/12066/12066.merge.sort.bam"
  "25428": "/DATA/casadei7/nanopore/WGS/CONTROL/25428/25428.merged.sort.bam"

path: "/DATA/casadei7/tools/SV-PIPELINE-main/outs_test_CNTRL"
ref: "/DATA/Reference/hg38.fa"
threads: 32

# ============================================================
# TARGET PANEL AND GENE REFERENCES
# ============================================================
# Structural-variant callers and Clair3 are genome-wide. The BED below is
# retained as the optic-neuropathy panel reference for panel annotation and
# compatibility with other workflows; the active LRS Clair3 rule does not use it.

bed: "/DATA/casadei7/tools/SV-PIPELINE-main/PANEL_OA/optic_neuropathy_panel.bed"

# Retained for backward compatibility/reference only; cuteSV is now called
# genome-wide and does not use this BED in Snakefile_LRS_update.
bedcutesv: "/DATA/casadei7/tools/SV-PIPELINE-main/PANEL_OA/optic_neuropathy_panel_cutesv.bed"

gene_bed: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/gencode.genes.hg38.sorted.bed"
candidate_genes_list: "/DATA/casadei7/tools/SV-PIPELINE-main/PANEL_OA/optic_neuropathy_genes.txt"

delly_genome: "ont"

# null = genome-wide tandem-repeat expansion discovery.
straglr_bed: null
straglr_script: "/home/casadei7/straglr/straglr.py"
straglr_annotation_min_overlap: 1

# null = extract modification calls genome-wide.
# Example targeted region: "chr3:193600000-193700000"
cpg_region: null

# ============================================================
# ENVIRONMENTS / EXECUTABLES
# ============================================================

condaenv: "/DATA/casadei7/tools/SV-PIPELINE-main/envs/"

# modkit 0.6.4 executable installed on the analysis server.
# Retained for reference; the active rule uses the modkit executable supplied
# by envs/modkit.yaml.
#modkitenv: "/home/casadei7/dist_modkit_v0.6.4_cd85862/modkit"
modkitenv: "/home/casadei7/.cargo/bin/modkit"

# Main modkit processing uses the full Snakemake thread allocation (32).
# Main processing, I/O, sampling and BGZF compression are all set to 32 threads.
modkit_io_threads: 32
modkit_sampling_threads: 32
modkit_bgzf_threads: 32

# Clair3 ONT model directory.
clair3env: "/DATA/casadei7/BrainAging/Clair3_Models/r1041_e82_400bps_sup_v520/"

# ============================================================
# SNIFFLES2 / JASMINE
# ============================================================

vntr_bed: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/human_GRCh38_no_alt_analysis_set.trf.bed"

# false = standard germline calling.  Enable only when intentionally running
# Sniffles mosaic mode.
sniffles_mosaic: false

# Keep Sniffles' standard QC logic.  Leave this false in production.
sniffles_no_qc: false

# Controlled rescue of large Sniffles2 calls rejected only as COV_VAR.
# When enabled, the Sniffles discovery rule adds --qc-output-all so rejected
# candidates are available to the downstream evidence filter.  The filter
# rescues ONLY COV_VAR records satisfying all criteria below; other Sniffles
# QC failures remain excluded.
sniffles_rescue_cov_var: true
sniffles_cov_var_min_support: 2
sniffles_cov_var_min_svlen: 50000
sniffles_cov_var_svtypes:
  - DEL
  - DUP

# This order MUST match the order written to Jasmine's file_list because
# SUPP_VEC is decoded using this order.
jasmine_caller_order: "Sniffles2,cuteSV,Delly"

# ============================================================
# VEP
# ============================================================

reference_dir: "/DATA/casadei7/tools/SV-PIPELINE-main/reference"
vep_cache_dir: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/vep"
vep_assembly: "GRCh38"

# ============================================================
# needLR POPULATION-AF BACKEND
# ============================================================
# needLR is a supplementary population-frequency branch.  It is NOT the
# source VCF for AnnotSV/VEP and therefore cannot remove BND or >=10 Mb calls
# from the master diagnostic/discovery callset.

needlr_backend_files: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/needlr/release/backend_files/"

# ============================================================
# TLDR
# ============================================================

tldr_elements: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/teref.ont.human.fa"

# Coordinate tolerances used only when attaching orthogonal evidence to the
# Jasmine-defined master SV table. They do not modify SV calling or merging.
orthogonal_straglr_breakpoint_tolerance: 500
orthogonal_tldr_breakpoint_tolerance: 500
orthogonal_longphase_breakpoint_tolerance: 500

# Optional region for the manual thesis methylation plot target.
# Keep null until a candidate locus is selected.
# Example: "chr3:193600000-193700000"
thesis_methylation_region: null

# ============================================================
# MITOCARTA / MITOCHONDRIAL CONTEXT
# ============================================================

# Official Human MitoCarta3.0 workbook. Download from the Broad Institute
# MitoCarta3.0 resource into this local path before running the annotation.
mitocarta_file: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/mitocarta/Human.MitoCarta3.0.xls"
mitocarta_pathways_file: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/mitocarta/Human.MitoPathways3.0.gmx"

# ============================================================
# SAMPLOT READ-LEVEL BREAKPOINT EVIDENCE
# ============================================================

samplot_top_n: 20
samplot_min_mapq: 20
samplot_long_read_min_length: 1000
samplot_zoom_bp: 20000
samplot_window_bp: 5000
samplot_large_sv_threshold: 1000000

# Distance used by the mechanism-aware SV-gene event ranking to distinguish
# a breakpoint-proximal gene from a gene that is only inside a large
# inversion/BND interval.
sv_gene_breakpoint_tolerance: 10000

# ============================================================
# MONARCH / HPO DISCOVERY
# ============================================================

monarch_nodes: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/monarch/monarch-kg_nodes.tsv"
monarch_edges: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/monarch/monarch-kg_edges.tsv"
discovery_hpo_file: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/optic_neuropathy_hpo_terms.tsv"

# Optional AnnotSV HPO argument.  Leave null unless you intentionally want to
# pass patient/analysis HPO terms directly to AnnotSV.
hpo_terms: null

# ============================================================
# ANNOTSV
# ============================================================

annotsv_benign_af: 0.01
annotsv_annotations_dir: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/AnnotSV_annotations"

# ============================================================
# PRE-JASMINE SV EVIDENCE FILTERING
# ============================================================
# Applied per caller after caller-specific evidence normalization.  Hard
# filters control which records enter Jasmine; soft flags remain visible in
# the TSV and final integrated table.

filter_sv_evidence_script: "/DATA/casadei7/tools/SV-PIPELINE-main/scripts/filter_sv_evidence.py"

evidence_min_support: 2
evidence_min_svlen: 50

# Keep the LRS master SV callset on canonical GRCh38 chromosomes only.
# BND/TRA records are retained only when both breakends are canonical.
canonical_chromosomes_only: true

# No upper SV-length hard filter in the master callset. Large events remain
# available to Jasmine/AnnotSV/integrated analysis. needLR independently
# excludes BNDs and SVs >=10 Mb from population-frequency annotation.
evidence_max_svlen: null

# Optional soft flags:
# evidence_min_gq: 10
# evidence_blacklist_bed: "/path/to/low_mappability_segdup.bed"

# Companion evidence set only.  The complete Jasmine callset remains the
# source of truth even for single-caller calls.
high_confidence_min_supp: 2


# Allele-level research assessment. Does not filter the master SV universe.
# Optional TSV paths (or mappings from sample ID to path); see docs/ALLELE_ASSESSMENT.md.
allele_patient_context: null
allele_disease_models: null
allele_evidence: null
allele_family_genotypes: null
allele_rare_af: 0.01
allele_min_support: 5
allele_min_gq: 20
allele_min_dp: 5
methylation_units: "percent"  # modkit bedMethyl column 11


# ============================================================
# OPTIONAL FINAL THESIS ANALYSIS
# ============================================================
# These settings affect only the additive thesis_extensions.smk layer.
# They do not change SV calling, Jasmine merging, AnnotSV or needLR.

# Base coverage resolution used for large deletion/duplication depth support.
# Plotting combines these base bins into larger median bins for large events,
# which prevents individual depth spikes from dominating the figure.
depth_base_bin_bp: 10000
depth_min_mapq: 20
large_sv_depth_min_size: 100000

# Number of top genes/candidate gene-SV rows shown in the main thesis figures.
# Change this single value to 20 or 30 if you want a shorter/longer display.
thesis_top_genes: 25

# Publication-style R figures.
r_plot_top_candidates: 30
r_plot_top_hpo: 20

# Dorado sequencing summary is optional. Point each sample to the BAM created
# during Dorado basecalling (before downstream merging/reprocessing) when available.
dorado_bin: "dorado"
dorado_summary_bams: {}
# Example:
# dorado_summary_bams:
#   "21930": "/path/to/21930.basecalled.bam"
