# ============================================================
# LRS PIPELINE CONFIGURATION
# ============================================================

samples:
  # Always quote sample IDs that are numeric.
  "14996": "/DATA/casadei7/nanopore/WGS/14996_HMW_bam/14996_HMW_merged.bam"
  "21930": "/DATA/casadei7/nanopore/WGS/CONTROL/21930/21930.merged.sort.bam"
  "12066": "/DATA/casadei7/nanopore/WGS/CONTROL/12066/12066.merge.sort.bam"
  "25428": "/DATA/casadei7/nanopore/WGS/CONTROL/25428/25428.merged.sort.bam"

path: "/DATA/casadei7/tools/SV-PIPELINE-main/outs_test_CNTRL"
ref: "/DATA/Reference/hg38.fa"
threads: 32

# ============================================================
# TARGET PANEL AND ANNOTATION FILES
# ============================================================
# The SV discovery arm is genome-wide. The optic-neuropathy panel is used as
# a post-hoc annotation/prioritization view and for the complementary Clair3
# small-variant control arm.

bed: "/DATA/casadei7/tools/SV-PIPELINE-main/PANEL_OA/optic_neuropathy_panel.bed"

# Legacy path retained for backwards compatibility. The current LRS Snakefile
# does NOT restrict cuteSV to this BED; cuteSV is genome-wide so caller
# concordance has the same meaning inside and outside the panel.
bedcutesv: "/DATA/casadei7/tools/SV-PIPELINE-main/PANEL_OA/optic_neuropathy_panel_cutesv.bed"

# Gencode gene BED file for gene annotation.
gene_bed: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/gencode.genes.hg38.sorted.bed"

# Plain-text candidate gene list, one gene symbol per line.
candidate_genes_list: "/DATA/casadei7/tools/SV-PIPELINE-main/PANEL_OA/optic_neuropathy_genes.txt"

delly_genome: "ont"

# null = genome-wide tandem-repeat expansion discovery.
straglr_bed: null
straglr_script: "/home/casadei7/straglr/straglr.py"
straglr_annotation_min_overlap: 1

# null = extract CpG modification calls genome-wide.
# Set a region such as "chr3:193600000-193700000" if needed.
cpg_region: null

# ============================================================
# ENVIRONMENTS / EXECUTABLES
# ============================================================
condaenv: "/DATA/casadei7/tools/SV-PIPELINE-main/envs/"

# Modkit executable location retained for compatibility/documentation.
modkitenv: "/home/casadei7/dist_modkit_v0.6.4_cd85862/modkit"

# Clair3 ONT model directory.
clair3env: "/DATA/casadei7/BrainAging/Clair3_Models/r1041_e82_400bps_sup_v520/"

# ============================================================
# SNIFFLES2 / NEEDLR COMPATIBILITY
# ============================================================
# needLR v4.1 backend calls were generated with Sniffles v2.6.2. The conda
# environment pins that version. This pipeline keeps the same raw Sniffles VCF
# as the needLR query so needLR annotations can be mapped back to Jasmine via
# the exact original Sniffles ID. Pre-Jasmine evidence filtering is performed
# afterwards and does not alter the raw Sniffles VCF.

vntr_bed: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/human_GRCh38_no_alt_analysis_set.trf.bed"

# false = standard SV calling. Keep false for the primary thesis workflow;
# needLR's population backend is not optimized for mosaic calling.
sniffles_mosaic: false

# ============================================================
# VEP
# ============================================================
reference_dir: "/DATA/casadei7/tools/SV-PIPELINE-main/reference"
vep_cache_dir: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/vep"
vep_assembly: "GRCh38"

# ============================================================
# needLR v4.1 population-AF backend
# ============================================================
# Must contain the matching v4.1 backend_files directory.
needlr_backend_files: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/needlr/release/backend_files/"

# ============================================================
# TLDR
# ============================================================
tldr_elements: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/teref.ont.human.fa"

# ============================================================
# OFFLINE GENE / PHENOTYPE DISCOVERY
# ============================================================
monarch_nodes: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/monarch/monarch-kg_nodes.tsv"
monarch_edges: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/monarch/monarch-kg_edges.tsv"
discovery_hpo_file: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/optic_neuropathy_hpo_terms.tsv"

# ============================================================
# ANNOTSV
# ============================================================
annotsv_benign_af: 0.01
annotsv_annotations_dir: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/AnnotSV_annotations"

# Optional AnnotSV HPO input. Leave null when patient-specific HPO terms are
# not available; the separate Monarch branch remains exploratory/discovery-only.
hpo_terms: null

# ============================================================
# PRE-MERGE SV EVIDENCE FILTERING
# ============================================================
# Applied per caller before Jasmine. Raw caller VCFs are preserved.

filter_sv_evidence_script: "/DATA/casadei7/tools/SV-PIPELINE-main/scripts/filter_sv_evidence.py"

# Hard filters determining which records enter Jasmine.
evidence_min_support: 2
evidence_min_svlen: 50

# Keep very large SVs in the master callset. needLR itself does not evaluate
# BNDs or SVs >=10 Mb; those calls are retained for AnnotSV/VEP/manual review
# and explicitly marked as not evaluated by needLR in the integrated table.
evidence_max_svlen: 250000000

# Optional soft flags; these annotate but do not drop records.
# evidence_min_gq: 10
# evidence_blacklist_bed: "/path/to/low_mappability_segdup.bed"

# ============================================================
# JASMINE CONSENSUS
# ============================================================
# Order is biologically important: SUPP_VEC and IDLIST are decoded using this
# exact file-list order to recover caller provenance.
jasmine_caller_order:
  - Sniffles2
  - cuteSV
  - delly

# Companion high-confidence view only. The complete Jasmine VCF remains the
# master annotation callset even when an SV is supported by a single caller.
high_confidence_min_supp: 2
