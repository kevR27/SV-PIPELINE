# ============================================================
# LRS PIPELINE CONFIGURATION
# ============================================================

samples:
#always put "" if name is integer
  "14996" : "/DATA/casadei7/nanopore/WGS/14996_HMW_bam/14996_HMW_merged.bam" #/data/lrs_bams/patient01.sort.bam
  "21930" : "/DATA/casadei7/nanopore/WGS/CONTROL/21930/21930.merged.sort.bam" #/data/lrs_bams/patient02.sort.bam
  "12066" : "/DATA/casadei7/nanopore/WGS/CONTROL/12066/12066.merge.sort.bam"
  "25428" : "/DATA/casadei7/nanopore/WGS/CONTROL/25428/25428.merged.sort.bam"

path: "/DATA/casadei7/tools/SV-PIPELINE-main/outs_test_CNTRL"
ref: "/DATA/Reference/hg38.fa"
threads: 32

# ============================================================
# TARGET PANEL AND ANNOTATION FILES
# ============================================================
# Used by Clair3, cuteSV and targeted Straglr analysis

bed: "/DATA/casadei7/tools/SV-PIPELINE-main/PANEL_OA/optic_neuropathy_panel.bed"
bedcutesv: "/DATA/casadei7/tools/SV-PIPELINE-main/PANEL_OA/optic_neuropathy_panel_cutesv.bed"

# Gencode gene BED file for gene annotation
gene_bed: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/gencode.genes.hg38.sorted.bed"

# Plain-text candidate gene list, one gene symbol per line
candidate_genes_list: "/DATA/casadei7/tools/SV-PIPELINE-main/PANEL_OA/optic_neuropathy_genes.txt"

delly_genome: "ont"

straglr_bed: null # genome-wide tandem-repeat expansion discovery
straglr_script: "/home/casadei7/straglr/straglr.py"

# null = extract CpG methylation genome-wide
# Set a region such as "chr3:193600000-193700000" if needed
cpg_region: null

# ============================================================
# ENVIRONMENTS
# ============================================================
condaenv: "/DATA/casadei7/tools/SV-PIPELINE-main/envs/" #"/home/casadei7/snakemake_envs/envs/"

# Modkit executable
modkitenv: "/home/casadei7/dist_modkit_v0.6.4_cd85862/modkit"

# Clair3 ONT model directory.
clair3env: "/DATA/casadei7/BrainAging/Clair3_Models/r1041_e82_400bps_sup_v520/"

# ============================================================
# SNIFFLES2
# ============================================================

# Reference-wide VNTR BED file required by Sniffles2
vntr_bed: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/human_GRCh38_no_alt_analysis_set.trf.bed"

# ============================================================
# VEP
# ============================================================

# Local offline VEP cache
# do this: vep_install -a cf -s homo_sapiens -y GRCh38 -c /refs/vep_cache --CONVERT

reference_dir: "/DATA/casadei7/tools/SV-PIPELINE-main/reference" # "/home/casadei7/SV-PIPELINE-main/reference"

vep_cache_dir: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/vep" # "/home/casadei7/SV-PIPELINE-main/reference/vep" 

vep_assembly: "GRCh38"

# ============================================================
# needLR population-AF backend
# ============================================================
# Must contain the required 1KGP-LRSC ONT backend files.

needlr_backend_files: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/needlr/release/backend_files/"


# ============================================================
# TLDR
# ============================================================
# Must contain the ALU/LINE1/SVA reference sequences required by TLDR

tldr_elements: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/teref.ont.human.fa"

# ============================================================
# ANNOTATION
# ============================================================

# Offline Monarch Knowledge Graph
monarch_nodes: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/monarch/monarch-kg_nodes.tsv"
monarch_edges: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/monarch/monarch-kg_edges.tsv"

discovery_hpo_file: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/optic_neuropathy_hpo_terms.tsv"

# Benign population AF threshold

annotsv_benign_af: 0.01

# ============================================================
# ANNOTSV
#=============================================================

annotsv_annotations_dir: "/DATA/casadei7/tools/SV-PIPELINE-main/reference/AnnotSV_annotations"

# ============================================================
# SNIFFLES2 OPTIONS
# ============================================================

# false = standard SV calling
# true  = mosaic SV calling
sniffles_mosaic: false

# ============================================================
# PRE-MERGE SV EVIDENCE FILTERING 
# ============================================================
# Applied per-caller, before Jasmine merge. Does NOT change the
# sniffles2/cuteSV/delly command-line parameters themselves.

# Script used after caller-specific evidence parsing and before Jasmine.
filter_sv_evidence_script: "/DATA/casadei7/tools/SV-PIPELINE-main/scripts/filter_sv_evidence.py"

# Hard filters (drop from merge input):
evidence_min_support: 2          # min supporting reads (CALLER_SUPPORT)
evidence_min_svlen: 50           # bp
evidence_max_svlen: 5000000      # bp; raise if your panel expects larger CNVs

# Soft filters (flagged in evidence TSV, not dropped):
# evidence_min_gq: 10             # uncomment to flag low genotype-quality calls
# evidence_blacklist_bed: "/path/to/low_mappability_segdup.bed"  # optional

# High-confidence multi-caller companion set (Jasmine SUPP field)
high_confidence_min_supp: 2       # e.g. 2 of {sniffles2, cuteSV, delly} agree
