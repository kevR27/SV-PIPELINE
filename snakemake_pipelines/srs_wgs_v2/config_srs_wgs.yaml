# ============================================================
# SRS WGS V2 PIPELINE CONFIGURATION — ILLUMINA WGS
# ============================================================

samples:
  # Always quote sample IDs that are numeric.
  patient01: "/data/srs_bams/patient01.sorted.bam"
  patient02: "/data/srs_bams/patient02.sorted.bam"

# By default the workflow expects <bam>.bai. Uncomment this mapping when an
# index instead uses the alternative <sample>.bai naming convention.
# bam_indexes:
#   patient01: "/data/srs_bams/patient01.sorted.bai"
#   patient02: "/data/srs_bams/patient02.sorted.bai"

path: "/DATA/srs_results"
ref: "/DATA/Reference/hg38.fa"
threads: 32

# ============================================================
# TARGET PANEL AND REFERENCES
# ============================================================
# Manta, DELLY and DeepVariant are genome-wide. This BED is used only for
# downstream panel views; it is NOT used to restrict WGS discovery.
bed: "../../PANEL_OA/optic_neuropathy_panel.bed"
candidate_genes_list: "../../PANEL_OA/optic_neuropathy_genes.txt"

# DELLY short-read exclusion regions for GRCh38.
exclude_bed: "../../reference/delly_hg38_exclude.bed"

# ExpansionHunter is catalog-driven targeted genotyping, not de novo
# genome-wide STR discovery.
expansionhunter_catalog: "../../reference/variant_catalog_hg38_repeats.json"

# ============================================================
# ENVIRONMENTS / LOCAL DATABASES
# ============================================================
condaenv: "../../envs/"

vep_cache_dir: "/DATA/Reference/vep"
vep_assembly: "GRCh38"

annotsv_annotations_dir: "/DATA/Reference/AnnotSV_annotations"
annotsv_benign_af: 0.01

# Leave null unless actual patient HPO terms should be passed to AnnotSV.
hpo_terms: null

# Offline Monarch KGX TSV resources. The workflow intentionally does not use
# a live API, so a full run is reproducible and not network-dependent.
monarch_nodes: "/DATA/Reference/monarch/monarch-kg_nodes.tsv"
monarch_edges: "/DATA/Reference/monarch/monarch-kg_edges.tsv"
discovery_hpo_file: "../../reference/optic_neuropathy_hpo_terms.tsv"

# ============================================================
# PRE-SURVIVOR CALLER EVIDENCE FILTERING
# ============================================================
# The v2 workflow keeps caller-native PASS calls in the discovery universe and
# does not impose an additional universal read-count threshold before merging.
# Read support remains available for downstream technical assessment.
# Manta support = FORMAT PR_alt + SR_alt.
# DELLY support = INFO PE + SR, with FORMAT DV + RV fallback.
evidence_min_support: 0
evidence_min_svlen: 50

# Preserve very large and complex clinically relevant events. BND/TRA records
# without SVLEN are retained and flagged NO_SVLEN rather than removed.
evidence_max_svlen: 250000000

# Optional soft flags; these do not discard calls.
# evidence_min_gq: 10
# evidence_blacklist_bed: "/path/to/low_mappability_segdup.bed"

# ============================================================
# SURVIVOR MERGE
# ============================================================
# Complete union: minimum one caller. SUPP>=2 is emitted separately as a
# multi-caller-supported companion set and does not replace the master callset.
survivor_max_distance: 1000
survivor_min_support: 1
survivor_require_same_type: 1
survivor_require_same_strand: 1
survivor_use_size_ratio: 0
survivor_min_size: 50

# This order must match the VCF-list order written by the Snakefile.
survivor_caller_order: "Manta,Delly"
# This is caller concordance, not an assertion of biological "high confidence".
multi_caller_min_supp: 2

# Breakpoint distance used only to attach orthogonal MELT/EH locus evidence
# to the integrated table. It does not change the master SV universe.
orthogonal_breakpoint_tolerance: 500


# ============================================================
# SRS-WGS V2 INDEPENDENT EVIDENCE BRANCHES
# ============================================================
# GRIDSS is a breakpoint-assembly caller. It is NOT merged into the SURVIVOR
# caller-count metric because it reports breakpoint claims in BND notation.
gridss_enabled: true
gridss_blacklist: null
gridss_jvm_heap: "24g"
# Enable only if the input BAM was aligned in a way that already preserves
# usable split-read SA tags (for example standard bwa mem). False is safer.
gridss_skip_softclip_realignment: false

# CNVpytor supplies an independent read-depth/CNV layer and imports the
# genome-wide DeepVariant SNP VCF to calculate BAF signals. Calls from all bins
# are retained; the primary bin is exported as symbolic DEL/DUP VCF for AnnotSV.
cnvpytor_enabled: true
cnvpytor_bins: [1000, 10000]
cnvpytor_primary_bin: 1000

# Match read-depth calls to breakpoint-defined DEL/DUP events by reciprocal
# overlap. Unmatched CNVpytor calls remain in a separate discovery table.
independent_reciprocal_overlap: 0.50

# GRIDSS evidence must reproduce both event breakpoints within this tolerance.
# Unmatched GRIDSS events remain in a separate discovery table.
independent_breakpoint_tolerance: 500

# mtDNA analysis uses Mutserve on reads extracted from the configured mtDNA
# contig and a matching FASTA extracted directly from the same hg38 reference.
mtdna_enabled: true
mtdna_contig: "chrM"
# Mutserve default and published workflow-compatible minimum heteroplasmy level.
mutserve_level: 0.01


# ============================================================
# SRS-WGS V2 POSTPROCESSING / THESIS CONTEXT
# ============================================================
# These resources are used only by Snakefile_SRS_WGS_postprocess.
gene_bed: "../../reference/gencode.genes.hg38.sorted.bed"

# Keep these local and versioned deliberately. They are not downloaded by the
# workflow because hidden network-dependent reference updates reduce
# reproducibility.
mitocarta_file: "../../reference/mitocarta/Human.MitoCarta3.0.xls"
mitocarta_pathways_file: "../../reference/mitocarta/Human.MitoPathways3.0.gmx"

# Optional official GRCh38 gnomAD-SV sites VCF + .tbi. If null, the output
# explicitly reports RESOURCE_NOT_CONFIGURED rather than treating this as no
# population overlap.
gnomad_sv_vcf: null

sv_gene_breakpoint_tolerance: 500

# Short-read Samplot review. This SRS helper does not use --long_read.
samplot_top_n: 20
samplot_min_mapq: 20
samplot_zoom_bp: 20000
samplot_window_bp: 5000
samplot_large_sv_threshold: 1000000

# ============================================================
# MELTv2 MOBILE-ELEMENT INSERTIONS
# ============================================================
# MELTv2 is a manual/registration-gated installation, not the unrelated
# bioconda package named "melt". Keep disabled until every resource below is
# replaced with a valid server path.
# BAMs with MC/MQ mate tags (for example after samtools fixmate) run much more
# efficiently in MELTv2.2.2; the workflow does not rewrite the input BAM.
melt_enabled: false
melt_jar: "/DATA/Reference/MELTv2.2.2/MELT.jar"
melt_genes_bed: "/DATA/Reference/MELTv2.2.2/add_bed_files/Hg38/Hg38.genes.bed"
melt_java_memory_gb: 8

# Each MELT Single invocation accepts one transposon ZIP, not a text list.
melt_transposons:
  ALU: "/DATA/Reference/MELTv2.2.2/me_refs/Hg38/ALU_MELT.zip"
  LINE1: "/DATA/Reference/MELTv2.2.2/me_refs/Hg38/LINE1_MELT.zip"
  SVA: "/DATA/Reference/MELTv2.2.2/me_refs/Hg38/SVA_MELT.zip"
  HERVK: "/DATA/Reference/MELTv2.2.2/me_refs/Hg38/HERVK_MELT.zip"


# Allele-level research assessment. Does not filter the master SV universe.
# Optional TSV paths (or mappings from sample ID to path); see docs/ALLELE_ASSESSMENT.md.
allele_patient_context: null
allele_disease_models: null
allele_evidence: null
allele_family_genotypes: null
allele_rare_af: 0.01
allele_min_support: 5
allele_min_gq: 20
allele_min_dp: 5
