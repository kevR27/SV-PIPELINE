name: straglr
channels:
  - conda-forge
  - bioconda
dependencies:
  # Straglr 1.5.6 still imports distutils.spawn. distutils was removed from
  # Python 3.12, so keep this environment on the last Python release that
  # provides it rather than modifying the external Straglr source checkout.
  - python=3.11
  - bioconda::straglr=1.5.6
  - bioconda::bedtools
