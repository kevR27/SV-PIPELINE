# NOTE: Manta is archived upstream (Illumina stopped development), but the
# bioconda binary (last release 1.6.0) still runs fine on standard Linux
# WGS BAMs. Pin the version so a future bioconda-index change doesn't
# silently swap in something incompatible.
name: manta
channels:
  - conda-forge
  - bioconda
dependencies:
  # Manta 1.6.0 uses Python 2 for configuration, running and inversion conversion.
  # Pin Python 2.7 so we do not resolve an older Manta build without python2.
  - python=2.7
  - bioconda::manta=1.6.0
  # Older samtools matches Manta's legacy Python 2.7 environment more closely.
  # Let samtools install its matching htslib, bgzip and tabix binaries.
  - bioconda::samtools=1.9
