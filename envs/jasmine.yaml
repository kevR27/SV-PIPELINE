# Jasmine performs the SV merge; bcftools/htslib are used immediately after
# the merge to validate, sort, bgzip and index the master VCF.
name: jasmine
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::jasminesv=1.1.5
  - bioconda::bcftools=1.20
  - bioconda::htslib=1.20
  - python=3.11
