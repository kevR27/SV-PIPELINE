# Package name on bioconda is "jasminesv" (the tool CLI is still `jasmine`).
# The Snakefile also sanitizes and coordinate-sorts the merged VCF in this env.
name: jasmine
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::jasminesv=1.1.5
  - conda-forge::python=3.11
  - bioconda::pysam
  - bioconda::bcftools=1.20
  - bioconda::tabix
