# ExpansionHunter's GitHub is inactive (last real release 5.0.0, 2021)
# and Illumina has archived several sibling tools (Manta, Strelka), but
# the bioconda binary is stable and still the standard STR-expansion
# caller for Illumina SRS data - no functional issue running it via conda.
name: expansionhunter
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::expansionhunter=5.0.0
