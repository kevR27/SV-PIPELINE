# Bioconda installs the AnnotSV software but not the annotation databases.
# Those remain external and are referenced through annotsv_annotations_dir.
# This environment is also used by lightweight Python/BCFtools helper rules.
name: annotsv
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.11
  - bioconda::annotsv=3.5.10
  - bioconda::bcftools=1.20
  - bioconda::htslib
  - bioconda::tabix
