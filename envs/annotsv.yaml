# bioconda's annotsv package installs the binary/scripts only, not the
# annotation databases - see the annotsv_install_annotations rule in the
# Snakefile, which downloads them once via INSTALL_annotations.sh into
# a directory passed to every AnnotSV call via -annotationsDir.
name: annotsv
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::annotsv=3.5.10
  - bioconda::bcftools=1.20
