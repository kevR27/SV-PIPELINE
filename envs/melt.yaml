# MELTv2 is distributed as a licensed download (not on bioconda) from
# https://melt.igs.umaryland.edu/ - this env only provides the Java runtime
# and samtools/bwa deps MELT needs; place MELT.jar + me_refs under melt_dir
# in config_srs.yaml and set $MELT_HOME accordingly
name: melt
channels:
  - bioconda
  - conda-forge
dependencies:
  - openjdk=8
  - bowtie2
  - samtools=1.19
  - bcftools=1.19
  - mosdepth=0.3.8
