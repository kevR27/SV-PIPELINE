# DeepVariant is typically run via its official Docker/Singularity image
# rather than a bare conda env (it bundles TF + custom ops). If you want a
# conda-only path, use the bioconda build below; otherwise swap the
# `run_deepvariant` shell command in the Snakefile for a
# `singularity exec docker://google/deepvariant:1.6.1 ...` call instead.
name: deepvariant
channels:
  - bioconda
  - conda-forge
dependencies:
  - deepvariant=1.6.1
