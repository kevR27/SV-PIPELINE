# Dorado itself is not a conda package - install the official binary from
# https://github.com/nanoporetech/dorado (or ONT community page) and put it
# on PATH / point DORADOENV at it. This env only covers the CUDA/torch stack
# some of your auxiliary basecalling scripts may need.
name: torch
channels:
  - pytorch
  - nvidia
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - pytorch
  - pytorch-cuda=12.1
  - samtools=1.19
